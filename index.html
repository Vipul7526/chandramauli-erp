<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chandramauli Oil & Wheat ERP - Backend Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fbf8f2;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(217, 119, 6, 0.12);
      border: 1px solid #fed7aa;
      padding: 32px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #166534;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #16a34a;
      border-radius: 50%;
    }
    h1 {
      font-size: 22px;
      color: #b45309;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #d97706;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #b45309;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Backend API Active & Healthy</div>
    <h1>Chandramauli Oil & Wheat ERP</h1>
    <p>Serverless backend services connected to Supabase PostgreSQL database for billing, ledgers, and electricity tracking.</p>
    <a href="/api/health" class="btn">Test /api/health Endpoint</a>
    <div class="footer">
      Developer: Prince Singh &bull; Mirzapur, UP
    </div>
  </div>
</body>
</html>
